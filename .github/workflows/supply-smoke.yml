name: supply-smoke

# Автоматический стендовый smoke/e2e раздела «Снабжение» (TZ-SUPPLY-312/313).
# Поднимает docker-стенд (Mongo 7 + replica set rs0), запускает backend и гоняет
# scripts/smoke/supply-smoke.mjs (auth, Mongo, склад, upload-хранилище,
# быстрый заказ → реестр → отгрузка) + focused Jest по затронутым модулям.
# Скрипт smoke сам создаёт и удаляет свои тестовые записи.

on:
  pull_request:
    paths:
      - 'backend/src/modules/supply/**'
      - 'backend/src/modules/shipment/**'
      - 'backend/src/modules/storage-item/**'
      - 'backend/src/modules/warehouse/**'
      - 'backend/src/modules/material/**'
      - 'backend/src/modules/order/**'
      - 'backend/src/modules/counterparty/**'
      - 'backend/src/modules/site/**'
      - 'backend/src/modules/photos/**'
      - 'backend/src/modules/auth/**'
      - 'backend/src/app.module.ts'
      - 'scripts/smoke/**'
      - '.github/workflows/supply-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/modules/supply/**'
      - 'backend/src/modules/shipment/**'
      - 'backend/src/modules/storage-item/**'
      - 'backend/src/modules/warehouse/**'
      - 'backend/src/modules/material/**'
      - 'backend/src/modules/order/**'
      - 'backend/src/modules/counterparty/**'
      - 'backend/src/modules/site/**'
      - 'backend/src/modules/photos/**'
      - 'backend/src/modules/auth/**'
      - 'backend/src/app.module.ts'
      - 'scripts/smoke/**'
      - '.github/workflows/supply-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: '3000'
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123456
      MONGO_URI: mongodb://127.0.0.1:27017/kppdf?replicaSet=rs0
      MONGO_DB: kppdf
      MONGO_REPLICA_SET: rs0
      JWT_SECRET: ci-supply-smoke-jwt-secret-0123456789
      JWT_REFRESH_SECRET: ci-supply-smoke-refresh-secret-0123456789
      DISABLE_THROTTLE: '1'

    steps:
      - uses: actions/checkout@v4

      # В репо несколько pnpm-lock.yaml (root/backend/desktop/frontend):
      # setup-node с cache: pnpm без cache-dependency-path падает
      # с «Multiple lockfiles found». Ставим путь к backend-локфайлу.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Enable pnpm (corepack, pinned)
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.18.0 --activate

      - name: Init Mongo replica set
        run: |
          docker exec mongo mongosh --quiet --eval '
            try { rs.status() } catch (e) {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })
            }'

      - name: Install backend deps
        run: pnpm --dir backend install --frozen-lockfile

      - name: Build backend
        run: pnpm --dir backend build

      - name: Start backend (background)
        working-directory: backend
        run: |
          node dist/src/main.js > backend.log 2>&1 &
          echo "backend pid: $!"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "backend failed to start; log tail:"; tail -50 backend/backend.log; exit 1

      - name: Run supply smoke (real docker stand)
        run: |
          SUPPLY_SMOKE_USER="$ADMIN_USERNAME" SUPPLY_SMOKE_PASS="$ADMIN_PASSWORD" \
            node scripts/smoke/supply-smoke.mjs http://127.0.0.1:3000

      - name: Focused backend tests (supply/shipment/storage-item/material)
        run: pnpm --dir backend exec jest --silent src/modules/supply src/modules/shipment src/modules/storage-item src/modules/material
