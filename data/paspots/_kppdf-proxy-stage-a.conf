server {
    server_name kppdf-crm.ru 193.222.62.240 _;
    client_max_body_size 10M;
    http2 on;

    # TZ-AUTH-305 Stage A: server-level Basic stays for UI; enroll/static/API exempt.
    set $kppdf_basic "Private";
    if ($request_method = OPTIONS) {
        set $kppdf_basic "off";
    }
    auth_basic $kppdf_basic;
    auth_basic_user_file /etc/nginx/.htpasswd-kppdf;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cookie-check for future Stage B (internal only; unused until auth_request on /)
    location = /internal/device-check {
        internal;
        proxy_pass http://127.0.0.1:4200/api/device/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public enrollment SPA shell — no Basic (TZ-AUTH-305 Step 2)
    location /enroll/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA assets needed by /enroll/ must load without Basic
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /robots.txt {
        auth_basic off;
        alias /var/www/html/robots.txt;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        auth_basic off;
        access_log off;
        log_not_found off;
        proxy_pass http://127.0.0.1:4200;
    }

    # API: Nest JWT/pairing. Device enroll/status/session/auth-check live here.
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kppdf-crm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kppdf-crm.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = kppdf-crm.ru) {
        return 301 https://$host$request_uri;
    }
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kppdf-crm.ru 193.222.62.240 _;
    return 404;
}